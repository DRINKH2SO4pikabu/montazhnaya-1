name: Windows release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    permissions:
      contents: write # Needed only for creating the draft release.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress

      - name: Verify locked app dependencies, SRI and security audit
        run: npm run deps:ci

      - name: Download checksum-verified Electron runtime
        run: npm run electron:install

      - name: Verify Electron runtime version
        run: npm run electron:version

      - name: Run localization quality audit
        run: npm run qa:locales

      - name: Run regression tests
        run: npm test

      - name: Verify locked electron-builder toolchain and audit
        run: npm run release-tools:ci

      - name: Build NSIS installer and portable executable
        run: npm run dist:win

      - name: Verify installer and portable outputs
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -Path release -Filter *.exe)
          if ($executables.Count -lt 2) { throw "Expected both NSIS Setup and Portable EXE; found $($executables.Count)." }
          $names = $executables.Name -join "`n"
          if ($names -notmatch "Setup" -or $names -notmatch "Portable") { throw "Expected one Setup and one Portable output. Found: $names" }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path release -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii -LiteralPath ($_.FullName + ".sha256.txt")
          }

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Montazhnaya-beta-${{ github.ref_name }}-Windows-x64
          path: |
            release/*.exe
            release/*.sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create draft GitHub release for tagged builds
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: true
          files: |
            release/*.exe
            release/*.sha256.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
