name: Montazhnaya CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localization:
    name: Localization and tooltip QA (Node-only)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run complete localization quality audit
        run: npm run qa:locales

      - name: Run security and tooltip catalogue regression tests
        run: node --test tests/security-config.test.cjs tests/tooltip-source-catalog.test.cjs

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Verify locked app dependencies, SRI and security audit
        run: npm run deps:ci

      - name: Download checksum-verified Electron runtime
        run: npm run electron:install

      - name: Verify Electron runtime version (Linux CI)
        if: runner.os == 'Linux'
        run: npm exec -- electron --no-sandbox --version
      - name: Verify Electron runtime version
        if: runner.os != 'Linux'
        run: npm run electron:version

      - name: Run localization quality audit
        run: npm run qa:locales

      - name: Syntax checks
        shell: bash
        run: |
          node --check electron/main.cjs
          node --check electron/frame-sequence.cjs
          node --check electron/h264-encoder.cjs

      - name: Run unit and FFmpeg integration tests
        run: npm test

      - name: Verify and audit locked Windows release toolchain
        if: runner.os == 'Windows' && hashFiles('tools/release-toolchain/package-lock.json') != ''
        run: npm run release-tools:ci

      - name: Report pending Windows release toolchain lockfile
        if: runner.os == 'Windows' && hashFiles('tools/release-toolchain/package-lock.json') == ''
        shell: pwsh
        run: "Write-Output 'SKIPPED: release-toolchain lockfile is not committed yet. Windows Setup/Portable releases remain blocked.'"
